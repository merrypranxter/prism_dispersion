<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>minimal prism — standalone WebGL2 dark_side</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<!--
  The smallest standalone version of the dark_side regime: one HTML file, inline
  shaders, no imports, no build. A white beam refracts through a triangular prism
  once per wavelength (Snell + Cauchy) and fans into a spectrum. Good copy/paste
  starting point. Open via any static server.
-->
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2');
if (!gl) throw new Error('WebGL2 required');

const VERT = `#version 300 es
void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position=vec4(p*2.0-1.0,0,1); }`;

const FRAG = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2 u_res; uniform float u_time;
const float A=1.52, B=0.006;             // Cauchy: n(λ)=A+B/λ²
const int   N=28;                        // wavelength samples
const float H=0.45, W=0.52;

// inline wavelength(nm) -> rgb (Bruton approximation)
vec3 wl2rgb(float nm){
  vec3 c=vec3(0.0);
  if(nm<440.0){c.r=-(nm-440.0)/60.0;c.b=1.0;}
  else if(nm<490.0){c.g=(nm-440.0)/50.0;c.b=1.0;}
  else if(nm<510.0){c.g=1.0;c.b=-(nm-510.0)/20.0;}
  else if(nm<580.0){c.r=(nm-510.0)/70.0;c.g=1.0;}
  else if(nm<645.0){c.r=1.0;c.g=-(nm-645.0)/65.0;}
  else c.r=1.0;
  float f=1.0; if(nm<420.0)f=0.3+0.7*(nm-380.0)/40.0; else if(nm>645.0)f=0.3+0.7*(700.0-nm)/55.0;
  return pow(clamp(c*f,0.0,1.0), vec3(0.8));
}
float beamRay(vec2 p, vec2 o, vec2 d, float w){ vec2 q=p-o; float t=max(dot(q,d),0.0); float l=length(q-d*t); return exp(-l*l/(w*w)); }
float beamSeg(vec2 p, vec2 a, vec2 b, float w){ vec2 pa=p-a,ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); float l=length(pa-ba*h); return exp(-l*l/(w*w)); }
float rayLineT(vec2 o, vec2 d, vec2 a, vec2 b){ vec2 e=b-a; float den=d.x*e.y-d.y*e.x; if(abs(den)<1e-6)return -1.0; return ((a.x-o.x)*e.y-(a.y-o.y)*e.x)/den; }

void main(){
  vec2 p=(gl_FragCoord.xy*2.0-u_res)/u_res.y;
  vec2 apex=vec2(0.0,H), bl=vec2(-W,-H), br=vec2(W,-H);
  float by=0.12*sin(u_time*0.5);
  float fL=clamp((H-by)/(2.0*H),0.0,1.0);
  vec2 entry=mix(apex,bl,fL);
  vec2 nL=normalize(vec2(-2.0*H,W)), nR=normalize(vec2(2.0*H,W));
  vec2 I=vec2(1.0,0.0);
  vec3 col=vec3(0.0);
  col += vec3(0.9)*beamSeg(p, vec2(-2.0,by), entry, 0.025);
  for(int i=0;i<N;i++){
    float t=(float(i)+0.5)/float(N);
    float nm=mix(380.0,700.0,t);
    float n=A+B/pow(nm/1000.0,2.0);
    vec3 wl=wl2rgb(nm);
    vec2 d1=refract(I,nL,1.0/n); if(d1==vec2(0.0))continue; d1=normalize(d1);
    float tR=rayLineT(entry,d1,apex,br); if(tR<=0.0)continue;
    vec2 ex=entry+d1*tR;
    vec2 d2=refract(d1,-nR,n); d2=(d2==vec2(0.0))?reflect(d1,nR):normalize(d2);
    col += wl*(1.2/float(N))*beamSeg(p,entry,ex,0.022);
    col += wl*(2.6/float(N))*beamRay(p,ex,d2,0.03);
  }
  col=col/(1.0+col);                  // simple tonemap
  o=vec4(pow(col,vec3(1.0/2.2)),1.0);
}`;

function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
const vao=gl.createVertexArray();
const uRes=gl.getUniformLocation(prog,'u_res'), uTime=gl.getUniformLocation(prog,'u_time');
const t0=performance.now();
function frame(t){
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr;
  gl.viewport(0,0,cv.width,cv.height);
  gl.useProgram(prog); gl.bindVertexArray(vao);
  gl.uniform2f(uRes,cv.width,cv.height);
  gl.uniform1f(uTime,(t-t0)/1000);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
